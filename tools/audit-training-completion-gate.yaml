name: audit-training-completion-gate
description: Run the Training Completion Gate deterministic analyzer
version: 0.1.0
input_schema:
  type: object
  properties:
    payload:
      type: object
      description: JSON payload matching the agent input contract
  required: [payload]
output_schema:
  type: object
  properties:
    findings: {type: array}
    valid: {type: boolean}
implementation:
  type: script
  path: audit-training-completion-gate.py
  runtime: python3
